name: Actualizar listas

on:
  schedule:
    - cron: "0 6 * * *"   # todos los dias a las 06:00 UTC
  workflow_dispatch:       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Generar las listas
        run: |
          set -uo pipefail
          TMP=$(mktemp -d)
          FALLAS=0

          falla() {
            echo "::error::$1: $2"
            FALLAS=$((FALLAS + 1))
          }

          descargar() {
            curl -fsSL --retry 3 --retry-delay 5 --max-time 180 "$1" -o "$2"
          }

          # Guarda la lista final (solo si pasa el mínimo; si no, conserva la anterior)
          # publicar SALIDA TITULO URL MINIMO ARCHIVO_CON_REGLAS EXTRA
          publicar() {
            local SALIDA="$1" TITULO="$2" URL="$3" MINIMO="$4" CUERPO="$5" EXTRA="$6"
            local N
            N=$(wc -l < "$CUERPO")
            echo "$SALIDA: $N reglas"
            if [ "$N" -lt "$MINIMO" ]; then
              falla "$SALIDA" "solo $N reglas (mínimo $MINIMO); se conserva la versión anterior"
              return
            fi
            {
              echo "! Title: $TITULO"
              echo "! Source: $URL"
              if [ -n "$EXTRA" ]; then echo "$EXTRA"; fi
              cat "$CUERPO"
            } > "$SALIDA"
          }

          # Listas en formato hosts (0.0.0.0 dominio) -> reglas ||dominio^
          # convertir_hosts SALIDA TITULO URL MINIMO
          convertir_hosts() {
            local SALIDA="$1" TITULO="$2" URL="$3" MINIMO="$4"
            if ! descargar "$URL" "$TMP/raw.txt"; then
              falla "$SALIDA" "no se pudo descargar $URL"
              return
            fi
            tr -d '\r' < "$TMP/raw.txt" \
              | awk '($1=="0.0.0.0" || $1=="127.0.0.1") && NF>=2 { d=tolower($2); if (d ~ /^[a-z0-9_-]+(\.[a-z0-9_-]+)+$/ && d !~ /^(localhost|ip6-|broadcasthost)/ && d != "0.0.0.0") print "||" d "^" }' \
              | sort -u > "$TMP/cuerpo.txt"
            publicar "$SALIDA" "$TITULO" "$URL" "$MINIMO" "$TMP/cuerpo.txt" ""
          }

          # Listas que ya están en formato adblock: se copian y se limpia el título.
          # Solo se conservan reglas de bloqueo de red (||...); se descartan filtros
          # cosméticos, excepciones, scriptlets, redirecciones, etc.
          # copiar_adblock SALIDA URL MINIMO
          copiar_adblock() {
            local SALIDA="$1" URL="$2" MINIMO="$3"
            if ! descargar "$URL" "$TMP/raw.txt"; then
              falla "$SALIDA" "no se pudo descargar $URL"
              return
            fi
            tr -d '\r' < "$TMP/raw.txt" > "$TMP/limpio.txt"
            local TITULO EXTRA ACT EDAD
            TITULO=$(grep -m1 -i '^! *Title:' "$TMP/limpio.txt" | sed -E 's/^! *[Tt]itle: *//; s/ *\((AdGuard Home|Vivaldi)\) *$//' || true)
            if [ -z "$TITULO" ]; then TITULO="${SALIDA%.txt}"; fi
            EXTRA=$(grep -iE '^! *(Homepage|License):' "$TMP/limpio.txt" | head -n 2 || true)
            ACT=$(grep -m1 -i '^! *Updated:' "$TMP/limpio.txt" | sed -E 's/^! *[Uu]pdated: *//' || true)
            if [ -n "$ACT" ]; then
              EDAD=$(( ( $(date -u +%s) - $(date -u -d "$ACT" +%s 2>/dev/null || date -u +%s) ) / 86400 ))
              if [ "$EDAD" -gt 3 ]; then
                echo "::warning::$SALIDA: la lista original dice haberse actualizado hace $EDAD días ($ACT)"
              fi
            fi
            awk '
              /^\|\|/ {
                linea=$0; base=linea; opts=""
                i=index(linea,"$")
                if (i>0) { base=substr(linea,1,i-1); opts=substr(linea,i+1) }
                if (base ~ /[[:space:]#]/ || length(base)<4) next
                ok=1
                if (opts!="") {
                  n=split(opts,a,",")
                  for (k=1;k<=n;k++) if (a[k] !~ /^(script|third-party|3p|important|all|document|subdocument|image|stylesheet|xmlhttprequest|ping|media|font|websocket|other)$/) ok=0
                }
                if (ok) print linea
              }' "$TMP/limpio.txt" | awk '!visto[$0]++' > "$TMP/cuerpo.txt"
            publicar "$SALIDA" "$TITULO" "$URL" "$MINIMO" "$TMP/cuerpo.txt" "$EXTRA"
          }

          # ---- TUS LISTAS (una línea por lista) ----
          convertir_hosts stevenblack-brave.txt "StevenBlack hosts" "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts" 10000
          convertir_hosts peter-lowe.txt "Peter Lowe's Blocklist" "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts;showintro=0" 1000
          convertir_hosts dan-pollock.txt "Dan Pollock's hosts file" "https://someonewhocares.org/hosts/zero/" 2000
          copiar_adblock urlhaus-online.txt "https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-agh-online.txt" 300
          copiar_adblock urlhaus.txt "https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-agh.txt" 5000
          copiar_adblock phishing.txt "https://malware-filter.gitlab.io/malware-filter/phishing-filter-agh.txt" 1000
          copiar_adblock botnet.txt "https://malware-filter.gitlab.io/malware-filter/botnet-filter-agh.txt" 20
          copiar_adblock tracking.txt "https://malware-filter.gitlab.io/malware-filter/tracking-filter-vivaldi.txt" 1000

          if [ "$FALLAS" -gt 0 ]; then
            echo "Hubo $FALLAS lista(s) con problemas; las demás se guardaron igual."
            exit 1
          fi

      - name: Guardar cambios si alguna lista cambió
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.txt
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar listas"
            git push
          fi
