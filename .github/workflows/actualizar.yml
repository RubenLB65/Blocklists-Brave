name: Actualizar lista para Brave

on:
  schedule:
    - cron: "0 6 * * *"   # todos los dias a las 06:00 UTC
  workflow_dispatch:       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Convertir la lista de StevenBlack al formato de Brave
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          {
            echo "! Title: StevenBlack hosts (convertida para Brave)"
            echo "! Source: $URL"
            curl -fsSL "$URL" \
              | awk '$1=="0.0.0.0" && $2 ~ /\./ && $2 != "0.0.0.0" {print "||" tolower($2) "^"}' \
              | sort -u
          } > stevenblack-brave.txt
          LINEAS=$(wc -l < stevenblack-brave.txt)
          echo "Reglas generadas: $LINEAS"
          if [ "$LINEAS" -lt 10000 ]; then
            echo "La lista salió demasiado corta, se cancela para no publicar una lista rota."
            exit 1
          fi

      - name: Guardar cambios si la lista cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stevenblack-brave.txt
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar lista"
            git push
          fi
